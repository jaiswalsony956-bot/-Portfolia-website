<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1a0a00;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0d0d0d;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#DF8909;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#ff1d15;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#DF8909;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#ff1d15;stop-opacity:1" />
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="1.5" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background rounded square -->
  <rect width="64" height="64" rx="14" ry="14" fill="url(#bgGrad)"/>

  <!-- Orange border glow -->
  <rect width="62" height="62" x="1" y="1" rx="13" ry="13" fill="none" stroke="url(#borderGrad)" stroke-width="2" opacity="0.9"/>

  <!-- SJ text with gradient -->
  <text x="32" y="44"
        font-family="Poppins, Arial, sans-serif"
        font-size="28"
        font-weight="800"
        text-anchor="middle"
        fill="url(#textGrad)"
        filter="url(#glow)">SJ</text>
</svg>
